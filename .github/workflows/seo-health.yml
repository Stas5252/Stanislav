name: Weekly SEO health check
on:
  workflow_dispatch:
  schedule:
    - cron: '18 6 * * 1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-health.yml'
      - 'scripts/seo_audit.py'
permissions:
  contents: read
jobs:
  seo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check published site and sitemap
        run: python scripts/seo_audit.py
